<div class="container watchlist-container">
    <h2>My Watchlist <span aria-hidden="true">🍿</span> ({{watchedCount()}} watched)</h2>
    
    @if (movies().length === 0) {
        <p>No movies in your watchlist.</p>
    }
    <div class="watchlist-items-container">
        @for (movie of movies(); track movie.id){
            <div class="watchlist-item">
                <a [routerLink]="['/movie', movie.id]" class="watchlist-item-title"><strong>{{movie.title}}</strong></a>
                <button type="button" class="watched-toggle" role="checkbox" [attr.aria-checked]="movie.watched" [attr.aria-label]="'Watched: ' + movie.title" (click)="toggleWatched(movie.id)">
                    <span aria-hidden="true">{{movie.watched ? '✅' : '⬜️'}}</span>
                </button>
            </div>
        }
    </div>
</div>
