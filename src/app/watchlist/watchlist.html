<div class="container watchlist-container">
    <h2>My Watchlist <span aria-hidden="true">🍿</span> ({{watchedCount()}} watched)</h2>
    
    @if (movies().length === 0) {
        <p>No movies in your watchlist.</p>
    }
    <div class="watchlist-items-container">
        @for (movie of movies(); track movie.id){
            <div tabindex="0" class="watchlist-item" role="checkbox" (keydown)="toggleWatched($event, movie.id)" (click)="toggleWatched($event, movie.id)" [attr.aria-label]="'Watched: ' + movie.title" [attr.aria-checked]="movie.watched">
                <div><strong>{{movie.title}}</strong></div> 
                <div>({{movie.releaseDate}})</div>
                <div>Rating: {{movie.rating}}</div>
                <div aria-hidden="true">{{movie.watched ? '✅' : '⬜️'}}</div>
            </div>
        }
    </div>
</div>
